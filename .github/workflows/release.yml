name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build Gapo.slnx -c Release

      - name: Source rules (no comments in product source)
        run: artifacts\bin\Gapo.SourceRules\release\gapo-source-rules.exe check . --exclude demo --exclude docs

      - name: Unit tests
        run: dotnet test --solution Gapo.slnx -c Release --no-build

      - name: Package
        shell: pwsh
        run: ./tools/package-release.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if (-not $tag.StartsWith("v$version")) { throw "Tag $tag does not match version $version in Directory.Build.props." }
          $zip = "artifacts/release/GAPO-$version-win-x64.zip"
          $notes = "docs/release-notes/$tag.md"
          if (-not (Test-Path $notes)) { throw "Release notes $notes are missing." }
          $flags = @()
          if ($tag.Contains("-")) { $flags += "--prerelease" }
          gh release create $tag $zip "$zip.sha256" --title "GAPO $($tag.TrimStart('v'))" --notes-file $notes @flags
