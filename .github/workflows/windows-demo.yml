name: Windows demo build & end-to-end test

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          dotnet build demo/src/Sandbox/GAPO.Sandbox.csproj -c Release -nologo
          dotnet build demo/src/Optimiser/GAPO.Optimiser.csproj -c Release -nologo

      - name: Sandbox alone (unoptimised, 20 s)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\gapo"; New-Item -ItemType Directory -Force $out | Out-Null
          $exe = Resolve-Path demo/src/Sandbox/bin/Release/net462/GAPO-Sandbox.exe
          $p = Start-Process -FilePath $exe -ArgumentList "--reset","--autotest=20","--screenshot=$out\sandbox-before.jpg","--log=$out\sandbox-before.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "sandbox hung" }
          Get-Content "$out\sandbox-before.txt"

      - name: End-to-end (sandbox + optimiser)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\gapo"; $ui = "$out\ui"; New-Item -ItemType Directory -Force $ui | Out-Null
          $sb = Resolve-Path demo/src/Sandbox/bin/Release/net462/GAPO-Sandbox.exe
          $op = Resolve-Path demo/src/Optimiser/bin/Release/net462/GAPO-Optimiser.exe
          $s = Start-Process -FilePath $sb -ArgumentList "--reset","--autotest=200","--screenshot=$out\sandbox-after.jpg","--log=$out\sandbox-after.txt" -PassThru
          Start-Sleep -Seconds 3
          $o = Start-Process -FilePath $op -ArgumentList "--autotest=$ui" -PassThru
          if (-not $o.WaitForExit(330000)) { $o.Kill(); Write-Host "OPTIMISER TIMED OUT" }
          Get-ChildItem $ui | Format-Table Name, Length
          if (Test-Path "$ui\autotest-error.txt") { Get-Content "$ui\autotest-error.txt" }
          if (Test-Path "$ui\autotest-timeout.txt") { Get-Content "$ui\autotest-timeout.txt" }
          Write-Host "===== REPORT ====="
          if (Test-Path "$ui\report.txt") { Get-Content "$ui\report.txt" -Encoding UTF8 }
          Write-Host "===== OVERHEAD ====="
          if (Test-Path "$ui\overhead.txt") { Get-Content "$ui\overhead.txt" }
          if (-not $s.WaitForExit(240000)) { $s.Kill(); Write-Host "sandbox kill" }
          Write-Host "===== SANDBOX AFTER ====="
          if (Test-Path "$out\sandbox-after.txt") { Get-Content "$out\sandbox-after.txt" }

      - name: Launch check of the committed release binaries (what users download)
        shell: pwsh
        run: |
          if (-not (Test-Path demo/release/GAPO-Demo/GAPO-Sandbox.exe)) { Write-Host "No committed release binaries"; exit 0 }
          $out = "$env:RUNNER_TEMP\gapo-release"; New-Item -ItemType Directory -Force "$out\ui" | Out-Null
          $sb = Resolve-Path demo/release/GAPO-Demo/GAPO-Sandbox.exe
          $op = Resolve-Path demo/release/GAPO-Demo/GAPO-Optimiser.exe
          $s = Start-Process -FilePath $sb -ArgumentList "--autotest=40","--log=$out\sandbox.txt" -PassThru
          Start-Sleep -Seconds 3
          $o = Start-Process -FilePath $op -ArgumentList "--autotest=$out\ui" -PassThru
          $deadline = (Get-Date).AddSeconds(35)
          while ((Get-Date) -lt $deadline -and -not (Test-Path "$out\ui\1-home.png")) { Start-Sleep -Milliseconds 500 }
          $ok = Test-Path "$out\ui\1-home.png"
          if (-not $o.HasExited) { $o.Kill() }
          if (-not $s.WaitForExit(60000)) { $s.Kill() }
          Get-Content "$out\sandbox.txt"
          if (-not $ok) { throw "Release optimiser did not reach the connected home screen" }
          Write-Host "Release binaries: sandbox ran, optimiser scanned hardware and connected to the game."

      - name: Screenshots (compact, for log inspection)
        shell: pwsh
        run: |
          . ./demo/tools/Print-Screenshot.ps1
          $out = "$env:RUNNER_TEMP\gapo"
          Print-Screenshot "$out\sandbox-before.jpg" "SANDBOX_BEFORE" 400
          Print-Screenshot "$out\ui\3-results.png" "RESULTS" 560

      - name: Upload binaries and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: GAPO-Demo
          path: |
            demo/src/Sandbox/bin/Release/net462/GAPO-Sandbox.exe
            demo/src/Optimiser/bin/Release/net462/GAPO-Optimiser.exe
            ${{ runner.temp }}/gapo/**
          if-no-files-found: warn
