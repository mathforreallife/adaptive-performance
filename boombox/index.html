<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="build" content="v10">
<meta name="theme-color" content="#15131c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="description" content="Pon la cancion. Adivina el ano.">
<title>BoomBox</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='88'>&#127911;</text></svg>">
<style>
:root{
  --bg:#15131c; --card:#201c2b; --fg:#f8f3ea; --muted:#a49bb5; --line:#332c44;
  --accent:#ffc14d; --ink:#2b2000; --bad:#ff8d8d;
  --shadow:0 14px 34px rgba(0,0,0,.46); --disc1:#3a3350; --disc2:#4a4166;
  --ease:cubic-bezier(.22,.9,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  --accent-hi:#ffd98a; --pop1:#ff5fa2; --pop3:#8f7bff;
  --glow:rgba(255,193,77,.42); --blob:.2; --dots:rgba(255,255,255,.05);
  --press:color-mix(in srgb,var(--accent) 60%, #000);
  --disc:min(55vw,196px);
}
:root[data-theme="light"]{
  --bg:#f4ecdd; --card:#fffdf7; --fg:#29223a; --muted:#6b6379; --line:#e6dac5;
  --accent:#d97e10; --ink:#fffdf7; --bad:#c2453f;
  --shadow:0 14px 30px rgba(120,95,55,.17); --disc1:#1d1826; --disc2:#2a2336;
  --accent-hi:#f0a23a; --pop1:#ec4d8b; --pop3:#7c63ff;
  --glow:rgba(217,126,16,.30); --blob:.16; --dots:rgba(80,55,20,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg); color:var(--fg); font-size:16px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
  touch-action:manipulation; user-select:none;-webkit-user-select:none;
  transition:background .45s ease,color .45s ease;
}
.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",ui-serif,serif}

/* ---------- ambient background: drifting colour blobs + dot grid ---------- */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{content:"";position:absolute;inset:0;
  background-image:radial-gradient(var(--dots) 1.2px,transparent 1.7px);background-size:22px 22px;
  -webkit-mask-image:linear-gradient(180deg,#000,transparent 70%);mask-image:linear-gradient(180deg,#000,transparent 70%)}
.bgfx i{position:absolute;width:64vmax;height:64vmax;border-radius:50%;opacity:var(--blob)}
.bgfx i:nth-of-type(1){left:-30vmax;top:-34vmax;background:radial-gradient(circle,var(--pop3),transparent 62%);
  animation:drift1 26s ease-in-out infinite alternate}
.bgfx i:nth-of-type(2){right:-34vmax;top:12vh;background:radial-gradient(circle,var(--accent),transparent 62%);
  animation:drift2 31s ease-in-out infinite alternate}
.bgfx i:nth-of-type(3){left:-18vmax;bottom:-40vmax;background:radial-gradient(circle,var(--pop3),transparent 62%);
  animation:drift3 36s ease-in-out infinite alternate}
.bgfx b{position:absolute;left:50%;top:34%;width:110vmin;height:110vmin;margin:-55vmin 0 0 -55vmin;border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 62%);opacity:0;transition:opacity 1.2s ease}
body:has(#gameScreen:not([hidden]) .turntable.spin) .bgfx b{opacity:.85;animation:glowPulse 3.2s ease-in-out infinite}
@keyframes drift1{to{transform:translate(18vmax,14vmax) scale(1.15)}}
@keyframes drift2{to{transform:translate(-16vmax,18vmax) scale(.9)}}
@keyframes drift3{to{transform:translate(14vmax,-16vmax) scale(1.1)}}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.08);opacity:.55}}

#app{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 16px);
  max-width:540px;margin:0 auto;width:100%}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.screen[hidden]{display:none}

.screen:not([hidden]){animation:screenIn .42s var(--ease) both}
@keyframes screenIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes springIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 80%, transparent);outline-offset:3px}

/* ---------- buttons ---------- */
.btn{
  appearance:none;width:100%;min-height:58px;padding:17px 20px;border-radius:16px;
  border:2px solid var(--line);background:var(--card);color:var(--fg);
  font-family:inherit;font-weight:700;font-size:17px;line-height:1.25;cursor:pointer;
  position:relative;overflow:hidden;isolation:isolate;
  transition:transform .2s var(--ease),background .25s ease,box-shadow .2s var(--ease),
             opacity .3s ease,border-color .25s ease;
}
.btn:active{transform:translateY(2px) scale(.985)}
.btn[disabled]{opacity:.35;cursor:default}
.btn.primary{background:linear-gradient(180deg,var(--accent-hi),var(--accent) 70%);border-color:var(--accent);color:var(--ink);
  box-shadow:0 5px 0 0 var(--press),0 12px 26px -10px var(--glow)}
.btn.primary::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0))}
.btn.primary::after{content:"";position:absolute;top:-10%;bottom:-10%;left:0;width:34%;z-index:-1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-160%) skewX(-20deg)}
#startBtn:not([disabled])::after,#finAgain::after,#codeGo::after{animation:shine 4.6s ease-in-out infinite 1.6s}
@keyframes shine{0%{transform:translateX(-160%) skewX(-20deg)}28%,100%{transform:translateX(420%) skewX(-20deg)}}
.btn.primary:active{transform:translateY(4px);box-shadow:0 1px 0 0 var(--press),0 6px 14px -10px var(--glow)}
.btn.tall{min-height:64px;font-size:18.5px;letter-spacing:.01em}
.btn:not(.primary):active{border-color:var(--accent)}
@media (hover:hover){
  .btn:not([disabled]):hover{transform:translateY(-2px)}
  .btn.primary:not([disabled]):hover{box-shadow:0 7px 0 0 var(--press),0 16px 30px -10px var(--glow)}
  .btn.primary:not([disabled]):hover::after{animation:shine 1.1s ease-out}
  .btn:not(.primary):not([disabled]):hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .btn:not([disabled]):active{transform:translateY(4px)}
}
.ripple{position:absolute;border-radius:50%;pointer-events:none;z-index:-1;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 68%);
  transform:translate(-50%,-50%) scale(0);animation:ripple .6s ease-out forwards}
.btn:not(.primary) .ripple{background:radial-gradient(circle,color-mix(in srgb,var(--accent) 38%,transparent),transparent 68%)}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.linkbtn{background:none;border:0;color:var(--muted);font-family:inherit;font-weight:600;font-size:15px;
  text-decoration:underline;text-underline-offset:4px;text-decoration-color:color-mix(in srgb,var(--accent) 60%,transparent);
  cursor:pointer;min-height:48px;padding:12px;width:100%;transition:color .25s ease}
.linkbtn:active{color:var(--fg)}
@media (hover:hover){.linkbtn:hover{color:var(--fg)}}
.iconbtn{background:none;border:0;color:var(--muted);font-size:24px;line-height:1;
  width:48px;height:48px;display:grid;place-items:center;cursor:pointer;border-radius:12px;padding:0;
  transition:color .25s ease,background .25s ease,transform .2s var(--ease),border-color .25s ease}
.iconbtn:active{color:var(--fg);background:var(--card);transform:scale(.9)}
.gameHead .iconbtn,.sfxbtn{background:var(--card);border:2px solid var(--line);border-radius:14px}
#homeBtn{font-size:30px;padding-bottom:3px}
@media (hover:hover){.iconbtn:hover{color:var(--fg);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}}
.sfxbtn svg{width:22px;height:22px;display:block}
.sfxbtn .off{display:none}
.sfxbtn[aria-pressed="false"] .on{display:none}
.sfxbtn[aria-pressed="false"] .off{display:block}
.sfxbtn[aria-pressed="true"]{color:var(--accent)}
.sfxbtn[aria-pressed="true"] .on path+path{animation:wave 1.8s ease-in-out infinite}
.sfxbtn[aria-pressed="true"] .on path+path+path{animation-delay:.2s}
@keyframes wave{0%,100%{opacity:1}50%{opacity:.35}}
.iconbtn.bump{animation:bump .38s var(--spring)}

.topbar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;min-height:44px}
.langbox{display:flex;gap:2px;background:var(--card);border:2px solid var(--line);
  border-radius:12px;padding:3px;transition:border-color .25s ease,background .25s ease}
.langbox button{border:0;background:none;cursor:pointer;line-height:1;
  width:46px;height:44px;border-radius:9px;opacity:.45;transition:opacity .3s ease,background .3s ease,transform .2s var(--ease);
  display:grid;place-items:center;padding:0}
.langbox button:active{transform:scale(.92)}
.langbox button[aria-pressed="true"]{opacity:1;background:var(--line);animation:bump .4s var(--spring)}
@media (hover:hover){.langbox button:hover{opacity:.85}.langbox button:hover .flag{transform:rotate(-6deg) scale(1.08)}}
.flag{width:26px;height:17.5px;display:block;border-radius:2px;
  box-shadow:0 0 0 1px rgba(128,128,128,.45);transition:transform .25s var(--spring)}

/* ---------- home / lock ---------- */
.home{overflow-y:auto}
.homeMid{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:8px 0 4px}
.logo{position:relative;width:66px;height:66px;margin:0 auto 14px;border-radius:50%;
  background:linear-gradient(145deg,var(--accent-hi),var(--accent));
  color:var(--ink);display:grid;place-items:center;font-size:32px;cursor:pointer;
  box-shadow:var(--shadow),0 0 26px -4px var(--glow);transform:rotate(-6deg);transition:background .3s ease}
.logo::before{content:"";position:absolute;inset:-7px;border-radius:50%;pointer-events:none;
  background:var(--accent);opacity:.45;
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 3px))}
.logo::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none;
  animation:ping 3s ease-out infinite 1.4s}
@keyframes ping{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.75)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-5px) rotate(5deg)}}
@keyframes boop{0%{transform:scale(1) rotate(-6deg)}30%{transform:scale(1.25,.8) rotate(-6deg)}55%{transform:scale(.88,1.14) rotate(8deg)}
                100%{transform:scale(1) rotate(-6deg)}}
@keyframes nope{0%,100%{transform:rotate(-6deg)}20%{transform:rotate(-24deg)}40%{transform:rotate(16deg)}60%{transform:rotate(-16deg)}80%{transform:rotate(8deg)}}
h1.title{font-size:clamp(42px,13vw,56px);margin:0;letter-spacing:-.02em;font-weight:700;
  text-shadow:.045em .045em 0 color-mix(in srgb,var(--pop1) 78%,transparent)}
h1.title .ch{display:inline-block;animation:letterIn .7s var(--spring) both;animation-delay:calc(.16s + var(--i) * .05s)}
@keyframes letterIn{0%{opacity:0;transform:translateY(.5em) scale(.5) rotate(-10deg)}100%{opacity:1;transform:none}}
.tag{color:var(--muted);font-size:16px;margin:10px 0 24px;line-height:1.55}
.settings{background:var(--card);border:2px solid var(--line);border-radius:18px;
  margin:20px 0 14px;overflow:hidden;text-align:left;box-shadow:0 18px 36px -24px rgba(0,0,0,.55);
  transition:background .3s ease,border-color .3s ease}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 16px;min-height:72px}
.row + .row{border-top:2px solid var(--line)}
.row .lbl{font-size:16.5px;font-weight:700;line-height:1.3}
.row .sub{font-size:14px;color:var(--muted);margin-top:4px;line-height:1.45}
.switch{flex:0 0 auto;width:62px;height:36px;border-radius:99px;border:0;padding:0;
  background:var(--line);position:relative;cursor:pointer;transition:background .3s ease,box-shadow .3s ease}
.switch::before{content:"";position:absolute;left:-5px;right:-5px;top:-7px;bottom:-7px;border-radius:99px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:30px;height:30px;
  border-radius:99px;background:#fffdf7;transition:transform .38s var(--spring),width .2s var(--ease);
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
.switch:active::after{width:36px}
.switch[aria-checked="true"]{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent),0 0 18px -4px var(--glow)}
.switch[aria-checked="true"]::after{transform:translateX(26px)}
.switch[aria-checked="true"]:active::after{transform:translateX(20px)}
.seg{display:flex;gap:6px;background:var(--line);padding:4px;border-radius:13px;flex:0 0 auto;transition:background .3s ease}
.seg button{border:0;background:none;color:var(--muted);font-family:inherit;font-weight:700;font-size:15px;
  padding:10px 15px;min-height:44px;border-radius:10px;cursor:pointer;
  transition:background .3s ease,color .3s ease,transform .2s var(--ease),box-shadow .3s ease}
.seg button:active{transform:scale(.95)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 2px 8px -2px rgba(0,0,0,.3);
  animation:bump .4s var(--spring)}
.stat{font-size:14.5px;color:var(--muted);margin:6px 0 0;line-height:1.55;transition:color .3s ease}

#homeScreen:not([hidden]) .logo{animation:springIn .7s var(--spring) both .05s,bob 3.6s ease-in-out infinite 1.1s}
#homeScreen:not([hidden]) h1.title{animation:riseIn .55s var(--ease) both .12s}
#homeScreen:not([hidden]) .tag{animation:riseIn .55s var(--ease) both .19s}
#homeScreen:not([hidden]) #startBtn{animation:riseIn .55s var(--ease) both .26s}
#homeScreen:not([hidden]) .settings{animation:riseIn .55s var(--ease) both .33s}
#homeScreen:not([hidden]) .stat{animation:riseIn .55s var(--ease) both .40s}
#lockScreen:not([hidden]) .logo{animation:springIn .7s var(--spring) both .05s,bob 3.6s ease-in-out infinite 1.1s}
#lockScreen:not([hidden]) h1.title{animation:riseIn .55s var(--ease) both .12s}
#lockScreen:not([hidden]) .tag{animation:riseIn .55s var(--ease) both .19s}
#lockScreen:not([hidden]) .codeIn{animation:riseIn .55s var(--ease) both .26s}
#lockScreen:not([hidden]) #codeGo{animation:riseIn .55s var(--ease) both .33s}
.screen:not([hidden]) .logo.boop{animation:boop .5s var(--spring)}
.screen:not([hidden]) .logo.nope{animation:nope .5s ease}

/* ---------- game ---------- */
.gameHead{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto}
#counter{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;
  padding:8px 14px;border-radius:99px;background:color-mix(in srgb,var(--card) 80%,transparent);
  border:2px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap;
  transition:opacity .25s ease}
#counter:empty{visibility:hidden}
#counter.bump{animation:bump .42s var(--spring)}
.stage{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0;padding:4px 0 0}
.notes{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.note{position:absolute;line-height:1;font-weight:700;font-family:Georgia,"Times New Roman",serif;opacity:0;
  text-shadow:0 2px 10px rgba(0,0,0,.25);animation:noteUp 2.6s ease-out forwards}
@keyframes noteUp{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}
                  18%{opacity:.95}
                  100%{opacity:0;transform:translate(var(--dx),-120px) scale(1.15) rotate(var(--rot))}}

.turntable{position:relative;width:var(--disc);height:var(--disc);border:0;
  background:none;padding:0;cursor:pointer;border-radius:50%;isolation:isolate;flex:0 0 auto;
  transition:transform .25s var(--ease),opacity .35s ease}
.turntable:active{transform:scale(.94)}
@media (hover:hover){.turntable:not([disabled]):hover{transform:scale(1.025)}.turntable:not([disabled]):active{transform:scale(.94)}}
.turntable[disabled]{opacity:.3;cursor:default}
.turntable.arm{animation:armIn .7s var(--spring)}
@keyframes armIn{0%{opacity:.25;transform:scale(.8) rotate(-14deg)}
                 60%{opacity:1;transform:scale(1.04) rotate(3deg)}
                 100%{opacity:1;transform:none}}
/* "tap me" ring while a song is waiting to be played */
.turntable::before{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--accent);
  opacity:0;pointer-events:none;z-index:-1}
.turntable:not([disabled]):not(.spin)::before{animation:invite 2.6s ease-out infinite 1.2s}
@keyframes invite{0%{opacity:.5;transform:scale(1)}75%,100%{opacity:0;transform:scale(1.2)}}
.halo{position:absolute;inset:-7%;border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(circle,var(--accent) 45%,transparent 70%);
  filter:blur(18px);opacity:0;transition:opacity .6s ease}
.turntable.spin .halo{opacity:.45;animation:haloBreathe 2.6s ease-in-out infinite}
.turntable.spin.loading .halo{animation-duration:1s}
@keyframes haloBreathe{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(1.05);opacity:.25}}
.disc{position:absolute;inset:0;border-radius:50%;
  background:repeating-radial-gradient(circle at 50% 50%, var(--disc1) 0 3px, var(--disc2) 3px 6px);
  box-shadow:var(--shadow), inset 0 0 0 2px rgba(255,255,255,.10), inset 0 0 0 9px rgba(0,0,0,.16);
  animation:spin 3.4s linear infinite paused;
  transition:background .4s ease}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:37%;height:37%;
  transform:translate(-50%,-50%);border-radius:50%;
  background:
    radial-gradient(circle, transparent 0 66%, rgba(255,255,255,.28) 67% 69%, transparent 70%),
    radial-gradient(circle at 35% 30%, var(--accent-hi), var(--accent) 65%);
  box-shadow:0 0 0 3px rgba(0,0,0,.18);
  transition:background .3s ease}
.turntable.spin .disc{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.sheen{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:1;
  background:conic-gradient(from 25deg,rgba(255,255,255,0) 0deg,rgba(255,255,255,.14) 26deg,rgba(255,255,255,0) 56deg,
    rgba(255,255,255,0) 180deg,rgba(255,255,255,.09) 206deg,rgba(255,255,255,0) 236deg);
  -webkit-mask:radial-gradient(circle,transparent 0 19%,#000 19.6%);mask:radial-gradient(circle,transparent 0 19%,#000 19.6%)}
.glyph{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  color:var(--ink);display:grid;place-items:center;width:37%;height:37%}
.glyph svg{width:46%;height:46%;transition:opacity .2s ease;animation:springIn .35s var(--spring)}
.glyph .pz{display:none}
.turntable.spin .glyph .py{display:none}
.turntable.spin .glyph .pz{display:block}
.tonearm{position:absolute;left:82%;top:-7%;width:30%;height:60%;z-index:3;pointer-events:none;color:var(--muted);
  transform-origin:75% 10%;transform:rotate(-24deg);transition:transform .75s var(--spring)}
.turntable.spin .tonearm{transform:rotate(0deg)}
.tonearm svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.ta-arm{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round}
.ta-head{fill:var(--accent)}
.ta-weight{fill:currentColor}
.ta-base{fill:var(--card);stroke:currentColor;stroke-width:2.5}
.ta-pin{fill:currentColor}
.turntable.busy{animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.42}}
.bar{width:var(--disc);height:6px;border-radius:99px;background:var(--line);overflow:hidden;flex:0 0 auto;
  transition:background .3s ease}
.bar i{display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--accent),var(--accent) 40%,var(--accent-hi) 55%,var(--accent));background-size:220% 100%;
  transition:width .22s linear,background .3s ease}
.turntable.spin ~ .bar i{animation:flow 1.6s linear infinite}
@keyframes flow{from{background-position:100% 0}to{background-position:-120% 0}}
.status{font-size:15px;color:var(--muted);min-height:21px;text-align:center;line-height:1.45;
  padding:0 8px;transition:opacity .22s ease}
.status:not(.fade){animation:statusIn .34s var(--spring)}
@keyframes statusIn{from{opacity:0;transform:translateY(6px) scale(.96)}to{opacity:1;transform:none}}
.status.fade{opacity:0}
.status.err{color:var(--bad)}
.tray{flex:0 0 auto;min-height:244px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px}
.answer{position:relative;overflow:hidden;border:2px solid transparent;border-radius:20px;
  background:linear-gradient(var(--card),var(--card)) padding-box,
             linear-gradient(135deg,var(--accent-hi),var(--accent) 45%,color-mix(in srgb,var(--accent) 30%,var(--line))) border-box;
  padding:18px 18px 20px;text-align:center;box-shadow:var(--shadow),0 18px 40px -22px var(--glow);transform:rotate(-.7deg);
  animation:deal .62s var(--spring)}
.answer::after{content:"";position:absolute;top:-20%;bottom:-20%;left:0;width:40%;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-140%) skewX(-18deg);animation:sweep 1.2s ease-out .45s both}
@keyframes sweep{to{transform:translateX(330%) skewX(-18deg)}}
@keyframes deal{0%{opacity:0;transform:translateY(34px) rotate(4.5deg) scale(.92)}
                100%{opacity:1;transform:translateY(0) rotate(-.7deg) scale(1)}}
#art{width:54px;height:54px;border-radius:11px;object-fit:cover;background:var(--line);margin-bottom:8px;
  box-shadow:0 6px 16px -4px rgba(0,0,0,.4);
  animation:springIn .55s var(--spring) both .08s}
#year{font-size:clamp(54px,17vw,76px);font-weight:700;line-height:.95;letter-spacing:-.03em;
  color:var(--accent);font-variant-numeric:tabular-nums;
  text-shadow:.035em .035em 0 color-mix(in srgb,var(--pop1) 45%,transparent);
  animation:riseIn .5s var(--ease) both .12s;transition:opacity .15s ease,filter .15s ease}
#year.rolling{opacity:.6;filter:blur(.5px)}
#year.landed{animation:land .6s var(--spring) both}
@keyframes land{0%{transform:scale(1.32);text-shadow:0 0 30px var(--glow)}
                100%{transform:scale(1);text-shadow:.035em .035em 0 color-mix(in srgb,var(--pop1) 45%,transparent)}}
#title{font-size:18px;font-weight:700;margin-top:9px;line-height:1.32;
  animation:riseIn .5s var(--ease) both .18s}
#artist{font-size:15px;color:var(--muted);margin-top:5px;line-height:1.4;
  animation:riseIn .5s var(--ease) both .24s}
#reveal:not(.hide){animation:riseIn .35s var(--ease) both}
#next:not(.hide){animation:riseIn .38s var(--ease) both}

/* ---------- finish ---------- */
.finish{justify-content:center;text-align:center;gap:0;overflow-y:auto}
.trophy{position:relative;font-size:62px;margin-bottom:10px;line-height:1.15;
  filter:drop-shadow(0 10px 18px var(--glow));
  animation:trophyIn .8s var(--spring) both,float 3.4s ease-in-out infinite 1s}
.trophy::before{content:"";position:absolute;left:50%;top:50%;width:2.1em;height:2.1em;margin:-1.05em 0 0 -1.05em;z-index:-1;
  border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(color-mix(in srgb,var(--accent) 34%,transparent) 0 9deg,transparent 9deg 22.5deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 70%);mask:radial-gradient(circle,#000 18%,transparent 70%);
  animation:spin 16s linear infinite}
@keyframes trophyIn{0%{opacity:0;transform:scale(.2) rotate(-25deg)}100%{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(3deg)}}
.finish h2{font-size:clamp(30px,8.5vw,38px);margin:0 0 12px;line-height:1.2;font-weight:700;
  text-shadow:.045em .045em 0 color-mix(in srgb,var(--pop1) 70%,transparent);
  animation:riseIn .55s var(--ease) both .12s}
.finish p{color:var(--muted);font-size:16.5px;line-height:1.6;margin:0 0 26px;padding:0 4px;
  animation:riseIn .55s var(--ease) both .2s}
#finAgain{animation:riseIn .55s var(--ease) both .28s}
#finMenu{animation:riseIn .55s var(--ease) both .34s}

.codeIn{width:100%;min-height:62px;padding:16px;border-radius:14px;
  border:2px solid var(--line);background:var(--card);color:var(--fg);
  font:700 21px/1.2 ui-monospace,Menlo,Consolas,monospace;text-align:center;
  letter-spacing:.12em;text-transform:uppercase;caret-color:var(--accent);
  user-select:text;-webkit-user-select:text;margin-bottom:12px;
  transition:border-color .25s ease,background .25s ease,box-shadow .25s ease}
.codeIn::placeholder{color:var(--muted);opacity:.55}
.codeIn:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%, transparent),0 10px 26px -12px var(--glow)}
.errline{color:var(--bad);font-size:14.5px;min-height:20px;margin:10px 0 0;line-height:1.45;
  transition:opacity .25s ease}
.errline:not(:empty){animation:statusIn .34s var(--spring)}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.codeIn.shake{border-color:var(--bad)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
                 30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.hide{display:none !important}
footer{flex:0 0 auto;text-align:center;font-size:12px;color:var(--muted);opacity:.65;padding-top:14px;line-height:1.5;letter-spacing:.06em}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}

/* Short phones: tighten the game screen so the record, answer card and button
   all fit without scrolling. */
@media (max-height:700px){
  #app{padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:calc(env(safe-area-inset-bottom) + 10px)}
  #gameScreen{--disc:min(55vw,196px,max(112px,calc(100dvh - 444px)))}
  #gameScreen .stage{gap:14px}
  #gameScreen .tray{min-height:0;gap:10px}
  #gameScreen .btn.tall{min-height:58px}
  .answer{padding:14px 16px 15px}
  #art{width:46px;height:46px;margin-bottom:5px}
  #year{font-size:clamp(46px,14vw,60px)}
  #title{margin-top:6px}
  footer{padding-top:8px}
}
@media (max-height:600px){
  #gameScreen{--disc:min(55vw,196px,max(112px,calc(100dvh - 404px)))}
  #gameScreen .stage{gap:10px}
  #gameScreen .tray{gap:8px}
  #gameScreen .btn.tall{min-height:54px;padding-top:14px;padding-bottom:14px}
  .answer{padding:11px 14px 12px}
  #art{width:40px;height:40px;margin-bottom:4px}
  #year{font-size:clamp(42px,13vw,52px)}
  #title{font-size:17px;margin-top:4px}
  #artist{font-size:14px;margin-top:3px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
    transition-duration:.05ms !important}
  .bgfx i{animation:none !important}
}
</style>

});
document.addEventListener('click',function(e){
  if(!e.target.closest('.langbox')) return;
  var b=e.target.closest('button[data-lang]'); if(!b) return;
  settings.lang=b.getAttribute('data-lang'); saveSettings(); applyLang();
});
resetBtn.addEventListener('click',function(){
  played={}; savePlayed(); paintHome();
  statEl.textContent=t('cleared',{n:DECK_SOURCE.length});
});

playBtn.addEventListener('click',function(){
  if(!current||playBtn.disabled) return;
  // While the silent prime is running the element isn't paused, but for the
  // player the song hasn't started yet, so a tap here must mean "play".
  if(audio.paused || !wantPlay){
    var wasPriming=!audio.paused, g=gen;
    wantPlay=true; userStarted=true; priming=false; audio.muted=false;
    var p=audio.play();
    if(p&&p['catch']) p['catch'](function(){
      if(g!==gen || !wantPlay || !audio.paused) return;
      wantPlay=false; showSpin(false); playBtn.classList.remove('loading');
      setStatus(t('tapAgain'),true);
    });
    showSpin(true);
    if(wasPriming && audio.readyState<3){ playBtn.classList.add('loading'); setStatus(t('buffering')); }
    else setStatus('');
  }else{
    wantPlay=false; audio.pause(); showSpin(false); playBtn.classList.remove('loading'); setStatus(t('paused'));
  }
});
revealBtn.addEventListener('click',function(){
  if(!current||revealed) return;
  revealed=true;
  yearEl.textContent=current.song.y;
  titleEl.textContent=current.song.t;
  artistEl.textContent=current.song.a;
  if(current.meta.art){ artEl.src=current.meta.art; artEl.classList.remove('hide'); }
  else artEl.classList.add('hide');
  answer.classList.remove('hide');
  revealBtn.classList.add('hide');
  nextBtn.classList.remove('hide');
  FX.rollYear(current.song.y);
});
nextBtn.addEventListener('click',function(){
  if(busy) return;
  idx++;
  if(idx>=deck.length){
    if(settings.hideRepeats && remaining()===0){ showFinish(); return; }
    buildDeck(); setStatus(t('freshShuffle'));
  }
  audio.pause();
  resetRound();
  armFor(deck[idx]);
  prime();
});

audio.addEventListener('timeupdate',function(){
  var d=(audio.duration&&isFinite(audio.duration))?audio.duration:30;
  fillEl.style.width=Math.min(100,(audio.currentTime/d)*100)+'%';
});
audio.addEventListener('ended',function(){ wantPlay=false; showSpin(false); playBtn.classList.remove('loading'); setStatus(t('over')); });
audio.addEventListener('waiting',function(){ if(wantPlay){ playBtn.classList.add('loading'); setStatus(t('buffering')); } });
audio.addEventListener('playing',function(){ if(wantPlay){ playBtn.classList.remove('loading'); setStatus(''); } });
['play','playing','timeupdate','volumechange'].forEach(function(ev){ audio.addEventListener(ev,guardAutoplay); });
audio.addEventListener('error',function(){ if(current) setStatus(t('previewFail'),true); });
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });

var ALPHA="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
var SECRET="bmbx.f9e2337597a8b3d54bc8b2ae83ae6aa4";
function sha256bytes(str){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var b=[],i,c;
  for(i=0;i<str.length;i++){
    c=str.charCodeAt(i);
    if(c<128) b.push(c);
    else if(c<2048) b.push(192|(c>>6),128|(c&63));
    else if(c<55296||c>=57344) b.push(224|(c>>12),128|((c>>6)&63),128|(c&63));
    else { i++; c=0x10000+(((c&1023)<<10)|(str.charCodeAt(i)&1023));
      b.push(240|(c>>18),128|((c>>12)&63),128|((c>>6)&63),128|(c&63)); }
  }
  var bitLen=b.length*8;
  b.push(0x80);
  while(b.length%64!==56) b.push(0);
  var hi=Math.floor(bitLen/4294967296), lo=bitLen>>>0;
  b.push((hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,(lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255);
  function rr(x,n){ return (x>>>n)|(x<<(32-n)); }
  var w=new Array(64),a,bb,cc,d,e,f,g,h,t1,t2,j;
  for(i=0;i<b.length;i+=64){
    for(j=0;j<16;j++) w[j]=(b[i+j*4]<<24)|(b[i+j*4+1]<<16)|(b[i+j*4+2]<<8)|b[i+j*4+3];
    for(j=16;j<64;j++){
      var s0=rr(w[j-15],7)^rr(w[j-15],18)^(w[j-15]>>>3);
      var s1=rr(w[j-2],17)^rr(w[j-2],19)^(w[j-2]>>>10);
      w[j]=(w[j-16]+s0+w[j-7]+s1)|0;
    }
    a=H[0];bb=H[1];cc=H[2];d=H[3];e=H[4];f=H[5];g=H[6];h=H[7];
    for(j=0;j<64;j++){
      var S1=rr(e,6)^rr(e,11)^rr(e,25), ch=(e&f)^(~e&g);
      t1=(h+S1+ch+K[j]+w[j])|0;
      var S0=rr(a,2)^rr(a,13)^rr(a,22), maj=(a&bb)^(a&cc)^(bb&cc);
      t2=(S0+maj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
  }
  var out=[];
  for(i=0;i<8;i++) out.push((H[i]>>>24)&255,(H[i]>>>16)&255,(H[i]>>>8)&255,H[i]&255);
  return out;
}
function checkFor(serial){
  var d=sha256bytes(SECRET+":"+serial), o="";
  for(var i=0;i<6;i++) o+=ALPHA.charAt(d[i]&31);
  return o;
}
function validCode(raw){
  var c=String(raw||"").toUpperCase().replace(/[^0-9A-Z]/g,"");
  if(c.length!==12) return false;
  for(var i=0;i<12;i++) if(ALPHA.indexOf(c.charAt(i))<0) return false;
  return checkFor(c.slice(0,6))===c.slice(6);
}
function isUnlocked(){ try{ return localStorage.getItem(UNLOCK_KEY)==="1"; }catch(e){ return false; } }
function markUnlocked(){ try{ localStorage.setItem(UNLOCK_KEY,"1"); }catch(e){} }
function paramK(){
  var m=(location.search||"").match(/[?&]k=([^&#]+)/);
  return m?decodeURIComponent(m[1]):null;
}
function scrubUrl(){
  try{ if(history.replaceState) history.replaceState(null,"",location.pathname); }catch(e){}
}
codeInput.addEventListener('input',function(){
  var v=codeInput.value.toUpperCase().replace(/[^0-9A-Z]/g,'').slice(0,12);
  var g=v.match(/.{1,4}/g);
  codeInput.value=g?g.join('-'):'';
  codeErr.textContent='';
});
function trySubmit(){
  if(validCode(codeInput.value)){
    markUnlocked(); scrubUrl();
    codeErr.textContent='';
    showHome();
    FX.unlocked();
  }else{
    codeErr.textContent=t('codeBad');
    FX.rejected();
    codeInput.classList.remove('shake');
    void codeInput.offsetWidth;
    codeInput.classList.add('shake');
  }
}
codeGo.addEventListener('click',trySubmit);
codeInput.addEventListener('keydown',function(e){ if(e.key==='Enter') trySubmit(); });

function boot(){
  if(isUnlocked()){ scrubUrl(); showHome(); return; }
  var k=paramK();
  if(k && validCode(k)){ markUnlocked(); scrubUrl(); showHome(); return; }
  showLock();
}
function checkForUpdate(){
  if(!window.fetch||location.protocol==='file:') return;
  var F='boombox.reloadedFor';
  fetch(location.href.split('#')[0],{cache:'no-store'}).then(function(r){ return r.ok?r.text():null; })
  .then(function(txt){
    if(!txt) return;
    var m=txt.match(/name="build" content="([^"]+)"/);
    if(!m) return;
    if(m[1]===VERSION){ try{ sessionStorage.removeItem(F); }catch(e){} return; }
    var tried=null; try{ tried=sessionStorage.getItem(F); }catch(e){}
    if(tried===m[1]) return;
    try{ sessionStorage.setItem(F,m[1]); }catch(e){}
    location.reload();
  })['catch'](function(){});
}

applyTheme(); applyLang(); boot(); checkForUpdate();

})();
